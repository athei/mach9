[package]
name = "gamelauncher"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
compatdb-core = { workspace = true }
env_logger = { version = "0.11", default-features = false, features = ["humantime", "auto-color"] }
gamelauncher-core = { workspace = true }
libc = { workspace = true }
log = "0.4"
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "term"] }
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = ["std", "objc2-core-foundation", "NSAlert", "NSApplication", "NSButton", "NSCell", "NSClipView", "NSControl", "NSGraphics", "NSLayoutConstraint", "NSOpenPanel", "NSPanel", "NSResponder", "NSRunningApplication", "NSSavePanel", "NSScrollView", "NSText", "NSTextField", "NSTextView", "NSView", "NSWindow"] }
objc2-foundation = { workspace = true, features = ["std", "objc2-core-foundation", "NSArray", "NSBundle", "NSDate", "NSError", "NSGeometry", "NSRunLoop", "NSString", "NSURL"] }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }

[lints]
workspace = true
