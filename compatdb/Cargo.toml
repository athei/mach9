[package]
name = "compatdb"
version = "0.1.0"
edition = "2024"
publish = false
description = "The per-process compat library wine's ntdll loads as compatdb.so"

[lib]
crate-type = ["cdylib"]

[dependencies]
compatdb-core = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

# The workspace of compatdb and the rule table it is built on. compatdb is
# the root package; a plain cargo command in this directory acts on both.
[workspace]
resolver = "3"
members = [".", "core"]
default-members = [".", "core"]

[workspace.dependencies]
compatdb-core = { path = "core" }
libc = "0.2"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
