[package]
name = "compatdb"
version = "0.1.0"
edition = "2024"
publish = false
description = "The per-process compat library wine's ntdll loads as compatdb.so"

[lib]
crate-type = ["cdylib"]

[dependencies]
compatdb-table = { workspace = true }
libc = { workspace = true }

[lints]
workspace = true

# The workspace of compatdb and the rule table it is built on. compatdb is
# the root package; a plain cargo command in this directory acts on both.
[workspace]
resolver = "3"
members = [".", "table"]
default-members = [".", "table"]

[workspace.dependencies]
compatdb-table = { path = "table" }
libc = "0.2"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# The doc comments explain what a function is for; nothing here panics on
# input, and the table crate has no fallible functions to document.
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
codegen-units = 1
