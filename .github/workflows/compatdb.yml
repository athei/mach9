name: Compatdb

# Checks the compatdb crates in minutes, without the Wine build of
# release.yml.
#
# The tests, the lints and the rustdoc build run on Linux for compatdb-core
# alone. It is pure Rust with no platform code, and its rustdoc is the spec
# of WINE_COMPATDB, so a rustdoc warning such as a broken link fails the
# run. compatdb is a macOS cdylib: release.yml tests and lints it on its
# macOS runner before it builds, on every push to main that changes it and
# on a pull request from this repository. rustfmt checks both compatdb
# crates here, since formatting does not depend on the target. It runs on a
# push to main or a pull request that changes them or the workspace files.
# The launcher crates have their own checks in launcher.yml.

on:
  push:
    branches: [main]
    paths:
      - 'compatdb/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'pins/rust.env'
      - 'bin/fmt.sh'
      - '.github/workflows/compatdb.yml'
  # The same paths. This check is not a required one, so a pull request it
  # skips can still merge.
  pull_request:
    branches: [main]
    paths:
      - 'compatdb/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'pins/rust.env'
      - 'bin/fmt.sh'
      - '.github/workflows/compatdb.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main or to a pull request cancels the run it makes
# pointless.
concurrency:
  group: compatdb-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      MANIFEST: Cargo.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchains pins/rust.env pins: RUSTUP_TOOLCHAIN makes every
      # later cargo use RUST_STABLE, and bin/fmt.sh runs the rustfmt of
      # RUST_NIGHTLY, since rustfmt.toml uses options that only nightly
      # rustfmt applies.
      - name: Install the toolchains
        run: |
          . pins/rust.env
          rustup toolchain install "$RUST_STABLE" --profile minimal --component clippy
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_STABLE" >> "$GITHUB_ENV"

      - name: Check the formatting
        run: bin/fmt.sh --manifest-path "$MANIFEST" -p compatdb -p compatdb-core --check

      # Before the tests: the tests of DOCS_URL's links check each anchor
      # against the built pages when they exist (compatdb/core/src/docs).
      - name: Build the docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path "$MANIFEST" -p compatdb-core --no-deps

      - name: Test
        run: cargo test --locked --manifest-path "$MANIFEST" -p compatdb-core

      - name: Clippy
        run: cargo clippy --locked --manifest-path "$MANIFEST" -p compatdb-core --all-targets -- -D warnings
