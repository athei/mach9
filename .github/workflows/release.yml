name: Release

# Builds the bundle on a hosted runner, from the Wine branch in
# pins/wine-src.ref and the pins of this commit, and signs its loader with
# the identity in the secrets of the job's environment. An arm64-* tag
# attaches the bundle and its symbols to a draft release of that tag. A
# push to main that changes a file the build reads, the schedule, a manual
# run and a pull request to main build and bundle the same, check what
# packaging needs without packing, and publish nothing.
#
# The logic lives in bin/ and bin/ci/, which also run on a Mac. The caches
# a run on a tag writes serve only later runs on that tag. A run on main
# saves every cache it builds, which every later run can read, so a release
# finds the components the newest build of main built and its ccache
# directory. A run on a pull request restores the caches of main and saves
# none, so what a change that is not merged built never reaches another
# run. GitHub evicts a cache that no run used for a week; the scheduled
# runs, twice a week, use the current ones on main, so a release after a
# quiet week still finds them.

on:
  push:
    tags: ['arm64-*']
    branches: [main]
    # What the build and bundle steps read. GitHub applies path filters to
    # branch pushes only, so every arm64-* tag still runs.
    paths:
      - 'bin/**'
      - 'compatdb/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'pins/**'
      - 'signing/**'
      - 'smoke/**'
      - '.github/actions/**'
      - '.github/workflows/release.yml'
  # Twice a week, so no cache goes a week unused even when a run starts
  # late, and after brew-cache.yml's daily run, so the Homebrew kegs are
  # current.
  schedule:
    - cron: '47 5 * * 1,4'
  workflow_dispatch:
  # Every pull request to main, without a path filter: merging requires the
  # check this job reports, and a run that a filter skips reports none, which
  # blocks the merge.
  pull_request:
    branches: [main]

permissions:
  contents: write

# A push to main cancels the build of main that is still running, which a
# newer commit makes pointless, and a push to a pull request cancels the run
# of that pull request the same way; its ref is refs/pull/<number>/merge. A
# release is never cancelled, and a run on a tag shares its group with
# nothing but runs on that tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request' }}

# bash -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    # Holds the secrets MACOS_SIGNING_P12 and MACOS_SIGNING_P12_PASSWORD. A
    # run on a pull request uses pull-request, which holds a copy of them
    # and waits for the owner to approve each run. Every other run uses
    # release, whose deployment policy refuses the ref of a pull request, so
    # a pull request that changes this line gets no secrets from it. A pull
    # request from a fork gets no secrets at all, and its run stops at the
    # first step.
    environment: ${{ github.event_name == 'pull_request' && 'pull-request' || 'release' }}
    steps:
      # A pull request from a fork gets no secrets, so the bundle step could
      # not sign the loader. Stop before the build instead of after it.
      - name: Refuse a pull request from a fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "A pull request from a fork gets no signing secrets, so this run cannot"
          echo "bundle. Push the branch to this repository and open the pull request"
          echo "from there."
          exit 1

      # The scripts take the workspace, the parent of scripts/, as the root of
      # their layout: the Wine source in src/, downloads in cache/, the trees
      # under build/ and the bundle in dist/.
      - name: Checkout build scripts
        uses: actions/checkout@v7
        with:
          path: scripts
          persist-credentials: false

      # An empty ref would make the checkout below take the default branch.
      - name: Read the Wine source ref
        id: ref
        run: |
          ref=$(tr -d '[:space:]' < scripts/pins/wine-src.ref)
          if [ -z "$ref" ]; then
            echo "pins/wine-src.ref names no ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The whole history without file contents, which come with the
      # checkout: the build writes `git describe` into ntdll, and the notes
      # name it.
      - name: Checkout Wine source
        uses: actions/checkout@v7
        with:
          repository: athei/wine
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # athei/wine carries no Wine release tags, so git describe would find
      # none. The tag of the release the source is based on comes from the
      # GitHub mirror of Wine.
      - name: Fetch the Wine release tag
        run: |
          version=$(sed -n 's/^Wine version //p' src/VERSION)
          git -C src fetch --quiet --no-tags https://github.com/wine-mirror/wine \
            "refs/tags/wine-$version:refs/tags/wine-$version"
          git -C src describe HEAD

      # The Xcode host.sh chose on an earlier run on the same runner image,
      # so it need not ask every Xcode for its SDK again (host.sh, header).
      # The key changes with the image and with host.sh and profile.sh,
      # which decide the choice; a runner that names no image version gets a
      # key no other run has. A run on a pull request saves no choice, as it
      # saves no cache below.
      - name: Compute the Xcode choice key
        id: xcode-key
        run: echo "key=xcode-choice-$RUNNER_OS-$ImageOS-${ImageVersion:-run$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}-${{ hashFiles('scripts/bin/ci/host.sh', 'scripts/bin/lib/profile.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Xcode choice
        id: xcode-choice
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      - name: Report the runner, select Xcode and its Metal toolchain
        run: scripts/bin/ci/host.sh --metal --xcode-choice "$RUNNER_TEMP/xcode-choice"

      - name: Save the Xcode choice
        if: github.event_name != 'pull_request' && steps.xcode-choice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      # The formulae at the newest versions Homebrew has, from and into the
      # cache brew-cache.yml keeps current on the default branch. A run on a
      # pull request only reads it.
      - name: Install the Homebrew formulae
        uses: ./scripts/.github/actions/brew
        with:
          save: ${{ github.event_name != 'pull_request' }}

      # Each key changes with the pins of what its cache holds, not with the
      # rest of redist.env. The ccache key rolls:
      # every run restores the newest one of the prefix, and a run on the
      # default branch saves its own.
      # The compilers go through the ccache of the Homebrew formulae
      # (WINE_BUILD_CCACHE in profile.sh), with its directory and size limit
      # here.
      - name: Compute the cache keys
        id: keys
        run: |
          SCRIPT_DIR=scripts/bin . scripts/bin/lib/profile.sh
          . scripts/pins/redist.env
          xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          llvm15=$(scripts/bin/ci/pins-key.sh LLVM15_)
          redist=$(scripts/bin/ci/pins-key.sh MTLD3D_ LLVM_MINGW_)
          {
            echo "llvm15=dxmt-llvm15-$LLVM15_GIT_COMMIT-floor$MACOS_FLOOR-xcode$xcode-$ImageOS-$llvm15"
            echo "redist=redist-$redist"
            echo "ccache-prefix=ccache-$ImageOS-"
            echo "ccache=ccache-$ImageOS-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "WINE_BUILD_CCACHE=$DEPS_PREFIX/bin/ccache"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      # The downloads redist.env pins: llvm-mingw here, mtld3d in the bundle
      # step. Each is checked against its SHA-256 whether it was cached or not.
      # Saved at the end of the job, after the bundle step.
      - name: Restore the pinned downloads
        id: redist
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: ${{ steps.keys.outputs.redist }}

      - name: Install llvm-mingw
        run: |
          scripts/bin/ci/llvm-mingw.sh "$HOME/llvm-mingw"
          echo "MINGW_DIR=$HOME/llvm-mingw" >> "$GITHUB_ENV"

      - name: Add the Rust target
        run: rustup target add aarch64-apple-darwin

      # What cargo fetches for compatdb.so, which the bundle step builds.
      # Saved at the end of the job, as the pinned downloads.
      - name: Restore the cargo registry
        id: cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ hashFiles('scripts/Cargo.lock') }}

      # The tests and lints of every crate of the workspace. compatdb.so runs
      # from a Mach-O initializer inside Wine's ntdll, so its tests run here
      # and not in docs.yml. From the repository root, as bundle-wine.sh
      # builds it, so cargo reads .cargo/config.toml. Before the build, so a
      # failure costs minutes, not the whole build.
      - name: Test and lint the crates
        working-directory: scripts
        run: |
          rustup component add clippy
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings

      # One cache per staged dist (docs/internals.md, commands): Mesa with the
      # Vulkan loader, GStreamer, FEX, DXMT and vkd3d-proton. Its key is the
      # hash of the KEY line the dist's build script would write into it now
      # (--print-key): the commit its ref names (GStreamer's pin), the hash
      # of the script and profile.sh, and the versions of the compilers, SDK
      # and tools the script records. The script builds nothing when the
      # dist restored under that key is complete with that KEY, and builds
      # it otherwise; the bundle step checks every COMMIT against its ref
      # again. Restored before the build step and saved right after it, even
      # when that fails later, when the dist was built here and the run is
      # not on a pull request: under the hash of the KEY the build wrote, so
      # a ref that moved in between cannot file a dist under another
      # commit's key.
      - name: Compute the dist cache keys
        id: dists
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            key=$(scripts/bin/build-$c.sh --print-key)
            echo "$c: $key"
            echo "${c%%-*}=dist-$c-$ImageOS-$(printf '%s\n' "$key" | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Restore Mesa's dist
        id: mesa-dist
        uses: actions/cache/restore@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.dists.outputs.mesa }}

      - name: Restore GStreamer's dist
        id: gstreamer-dist
        uses: actions/cache/restore@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.dists.outputs.gstreamer }}

      - name: Restore FEX's dist
        id: fex-dist
        uses: actions/cache/restore@v6
        with:
          path: build/fex/dist
          key: ${{ steps.dists.outputs.fex }}

      - name: Restore DXMT's dist
        id: dxmt-dist
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.dists.outputs.dxmt }}

      - name: Restore vkd3d-proton's dist
        id: vkd3d-dist
        uses: actions/cache/restore@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.dists.outputs.vkd3d }}

      # The LLVM 15 libraries DXMT's winemetal.so links, which build-dxmt.sh
      # builds only when this directory holds no build of the pinned commit.
      # Saved right after the build step, even when that fails later, unless
      # the run is on a pull request.
      - name: Restore DXMT's LLVM
        id: llvm15-cache
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}

      - name: Restore the ccache directory
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}
          restore-keys: ${{ steps.keys.outputs.ccache-prefix }}

      # So that the statistics after the build are this run's.
      - name: Reset the ccache statistics
        run: '"$WINE_BUILD_CCACHE" --zero-stats'

      # Without --clean: the runner starts without build trees, so it would
      # only delete the dists restored above, which the scripts check
      # against their KEY themselves.
      - name: Build
        id: build
        run: scripts/bin/build-wine.sh

      - name: Report the ccache statistics
        if: always() && steps.build.conclusion != 'skipped'
        run: '"$WINE_BUILD_CCACHE" --show-stats'

      # Only on main, the default branch: every saved directory is a full
      # one, and a tag run's could only be read by later runs on that tag, so
      # saving them would fill the repository's cache budget for little. Tag
      # runs and runs on a pull request, whose ref is not main either,
      # restore the newest one main saved. The branch is named here because
      # the payload of a scheduled run has no repository to read the default
      # branch from.
      - name: Save the ccache directory
        if: always() && steps.build.conclusion != 'skipped' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}

      # The key each complete dist is saved under, from the KEY its build
      # wrote; none for a dist that is missing or incomplete.
      - name: Compute the dist save keys
        id: saves
        if: always() && steps.build.conclusion != 'skipped'
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            dist=build/$c/dist
            if [ -f "$dist/COMMIT" ] && [ -f "$dist/KEY" ]; then
              echo "${c%%-*}=dist-$c-$ImageOS-$(shasum -a 256 < "$dist/KEY" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done

      # Saved when the dist was not restored under the key it has now.
      - name: Save Mesa's dist
        if: always() && github.event_name != 'pull_request' && steps.saves.outputs.mesa != '' && (steps.mesa-dist.outputs.cache-hit != 'true' || steps.saves.outputs.mesa != steps.dists.outputs.mesa)
        uses: actions/cache/save@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.saves.outputs.mesa }}

      - name: Save GStreamer's dist
        if: always() && github.event_name != 'pull_request' && steps.saves.outputs.gstreamer != '' && (steps.gstreamer-dist.outputs.cache-hit != 'true' || steps.saves.outputs.gstreamer != steps.dists.outputs.gstreamer)
        uses: actions/cache/save@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.saves.outputs.gstreamer }}

      - name: Save FEX's dist
        if: always() && github.event_name != 'pull_request' && steps.saves.outputs.fex != '' && (steps.fex-dist.outputs.cache-hit != 'true' || steps.saves.outputs.fex != steps.dists.outputs.fex)
        uses: actions/cache/save@v6
        with:
          path: build/fex/dist
          key: ${{ steps.saves.outputs.fex }}

      - name: Save DXMT's dist
        if: always() && github.event_name != 'pull_request' && steps.saves.outputs.dxmt != '' && (steps.dxmt-dist.outputs.cache-hit != 'true' || steps.saves.outputs.dxmt != steps.dists.outputs.dxmt)
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.saves.outputs.dxmt }}

      - name: Save vkd3d-proton's dist
        if: always() && github.event_name != 'pull_request' && steps.saves.outputs.vkd3d != '' && (steps.vkd3d-dist.outputs.cache-hit != 'true' || steps.saves.outputs.vkd3d != steps.dists.outputs.vkd3d)
        uses: actions/cache/save@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.saves.outputs.vkd3d }}

      - name: Save DXMT's LLVM
        if: always() && github.event_name != 'pull_request' && steps.llvm15-cache.outputs.cache-hit != 'true' && hashFiles('build/dxmt/llvm15/COMMIT') != ''
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}

      # The secrets reach this step only.
      - name: Import the signing identity
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: scripts/bin/ci/keychain.sh setup

      - name: Bundle
        run: scripts/bin/bundle-wine.sh --strict-floor --symbols --yes

      # Only a release packs the trees, naming the tarballs after its tag.
      # Any other run passes --notes-only: package.sh runs every check it
      # makes before packing, writes the notes, and packs only a small part
      # of each tree with the same code, which it lists and deletes. A change
      # that breaks any of that fails on main or in its pull request before a
      # tag needs it, without spending the time to pack tarballs that would
      # be kept nowhere. A run on a pull request passes its number and
      # GITHUB_SHA, the commit that merges it into main, which the checkout
      # holds and the notes name.
      - name: Package
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/arm64-* ]]; then
            scripts/bin/ci/package.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/bin/ci/package.sh --notes-only "pr$PR_NUMBER-${GITHUB_SHA:0:11}" "$RUNNER_TEMP/release"
          else
            scripts/bin/ci/package.sh --notes-only "main-${GITHUB_SHA:0:11}" "$RUNNER_TEMP/release"
          fi

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/arm64-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release/notes.md" \
            "$RUNNER_TEMP/release/wine-$GITHUB_REF_NAME-macos-arm64.tar.xz" \
            "$RUNNER_TEMP/release/wine-$GITHUB_REF_NAME-macos-arm64-symbols.tar.xz"

      # The pinned downloads and the cargo registry, which the bundle step
      # completes, saved when they were not restored under their key. As
      # actions/cache does in its post step, they are saved at the end of the
      # job and only when every step before succeeded. A run on a pull
      # request saves neither.
      - name: Save the pinned downloads
        if: github.event_name != 'pull_request' && steps.redist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache
          key: ${{ steps.keys.outputs.redist }}

      - name: Save the cargo registry
        if: github.event_name != 'pull_request' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      - name: Remove the signing identity
        if: always()
        run: |
          if [ -x scripts/bin/ci/keychain.sh ]; then
            scripts/bin/ci/keychain.sh cleanup
          fi
