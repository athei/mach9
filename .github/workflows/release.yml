name: Build

# Builds the bundle and Mach9.app around it on a hosted runner, from the
# Wine branch in pins/wine-src.ref and the pins of this commit, and signs
# the loader and the app with the identity in the secrets of the job's
# environment. A tag vX.Y.Z or vX.Y.Z-rc.N also notarizes the app, builds
# its DMG, appcast and deltas, and attaches them, the bundle and its
# symbols to a draft release of that tag (docs/maintenance.md, releases).
# A push to main that changes a file the build reads, the schedule, a
# manual run and a pull request to main build, bundle, assemble and sign
# the same, pack the app's DMG, check what packaging needs without packing,
# and publish nothing.
#
# The logic lives in bin/, bin/ci/ and launcher/scripts/, which also run on
# a Mac. Only a run on main saves caches: every later run can read those, so
# a release finds the components the newest build of main built and its
# ccache directory. A cache saved on a tag or another branch would serve
# only later runs on that ref, so runs on tags, pull requests and other
# branches restore the caches of main and save none, and what a change that
# is not merged built never reaches another run. The branch is named
# because the payload of a scheduled run has no repository to read the
# default branch from. After a run on main, the prune job deletes the
# ccache directories, Homebrew kegs, pinned downloads and cargo registries
# of main that the build's saves replaced (bin/ci/prune-caches.sh). GitHub
# evicts a cache that no run used for a week; the scheduled runs, twice a
# week, use the current ones on main, so a release after a quiet week still
# finds them.

on:
  push:
    # A v and a digit, so a stray tag such as vfoo starts no run and cannot
    # take the place of a waiting release in the concurrency group below.
    tags: ['v[0-9]*']
    branches: [main]
    # What the build, bundle and app steps read. launcher.yml checks the
    # launcher crates in minutes; this run assembles the app. GitHub applies
    # path filters to branch pushes only, so every v[0-9]* tag still runs.
    paths:
      - 'launcher/**'
      - 'release-notes/**'
      - 'bin/**'
      - 'compatdb/**'
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - 'licenses/**'
      - 'pins/**'
      - 'signing/**'
      - 'smoke/**'
      - '.github/actions/**'
      - '.github/workflows/release.yml'
  # Twice a week, so no cache goes a week unused even when a run starts
  # late, and after brew-cache.yml's daily run, so the Homebrew kegs are
  # current.
  schedule:
    - cron: '47 5 * * 1,4'
  workflow_dispatch:
  # Every pull request to main, without a path filter: merging requires the
  # check this job reports, and a run that a filter skips reports none, which
  # blocks the merge.
  pull_request:
    branches: [main]

# A push to main cancels the build of main that is still running, which a
# newer commit makes pointless, and a push to a pull request cancels the run
# of that pull request the same way; its ref is refs/pull/<number>/merge. A
# release is never cancelled. All runs on v tags share one group, so a
# second tag waits for the first run and then meets its draft instead of
# building an appcast on the same latest release. GitHub keeps only one
# waiting run per group: a third tag pushed meanwhile cancels the waiting
# one, which then has to be re-run.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-tags' || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request' }}

# bash -eo pipefail, so a failure inside a pipe fails the step.
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    # contents for the draft release. Not actions: this job runs the code of
    # Wine, Mesa, FEX, bottles and crates, so the prune job below deletes
    # caches. For it, each family of keys it prunes and the key a save
    # succeeded under, empty when none did.
    permissions:
      contents: write
    outputs:
      brew-prefix: ${{ steps.brew.outputs.prefix }}
      brew-key: ${{ steps.brew.outputs.saved-key }}
      ccache-prefix: ${{ steps.keys.outputs.ccache-prefix }}
      ccache-key: ${{ steps.save-ccache.outcome == 'success' && steps.keys.outputs.ccache || '' }}
      redist-prefix: ${{ steps.keys.outputs.redist-prefix }}
      redist-key: ${{ steps.save-redist.outcome == 'success' && steps.keys.outputs.redist || '' }}
      cargo-prefix: ${{ steps.keys.outputs.cargo-prefix }}
      cargo-key: ${{ steps.save-cargo.outcome == 'success' && steps.cargo.outputs.cache-primary-key || '' }}
    # Holds the secrets MACOS_SIGNING_P12 and MACOS_SIGNING_P12_PASSWORD. A
    # run on a pull request uses pull-request, which holds a copy of them
    # and waits for the owner to approve each run. Every other run uses
    # release, whose deployment policy refuses the ref of a pull request, so
    # a pull request that changes this line gets no secrets from it. Only
    # release holds the secrets of a tag run's own steps, NOTARY_API_KEY,
    # NOTARY_KEY_ID, NOTARY_ISSUER and SPARKLE_ED_KEY. A pull request from a
    # fork gets no secrets at all, and its run stops at the first step.
    environment: ${{ github.event_name == 'pull_request' && 'pull-request' || 'release' }}
    steps:
      # A tag is a release version, as check_version in
      # launcher/scripts/lib.sh has it: vX.Y.Z, or vX.Y.Z-rc.N for a release
      # candidate of X.Y.Z, whose draft is a prerelease. Any other tag stops
      # here. Every later step takes a run on a tag for a release.
      - name: Check the tag
        id: tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $re ]]; then
            echo "The tag $GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rc.N."
            exit 1
          fi
          version=${GITHUB_REF_NAME#v}
          {
            echo "version=$version"
            echo "base=${version%-rc.*}"
            if [[ "$version" == *-rc.* ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      # The appcast of a release is built on the one of the latest published
      # release, so drafts have to be published in the order they were made.
      # A draft of an earlier run of this tag has to be deleted before the
      # run is repeated, as gh release create would refuse it at the end.
      - name: Refuse while a v* draft exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft and (.tag_name | startswith("v"))) | .tag_name')
          if [ -n "$drafts" ]; then
            echo "These v* releases are drafts; publish or delete them first:"
            echo "$drafts"
            exit 1
          fi

      # A pull request from a fork gets no secrets, so the bundle step could
      # not sign the loader. Stop before the build instead of after it.
      - name: Refuse a pull request from a fork
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "A pull request from a fork gets no signing secrets, so this run cannot"
          echo "bundle. Push the branch to this repository and open the pull request"
          echo "from there."
          exit 1

      # The scripts take the workspace, the parent of scripts/, as the root of
      # their layout: the Wine source in src/, downloads in cache/, the trees
      # under build/ and the bundle in dist/.
      - name: Checkout build scripts
        uses: actions/checkout@v7
        with:
          path: scripts
          persist-credentials: false

      # The checks of a release that need nothing built (appcast.sh, header):
      # the version against the workspace version and the appcast of the
      # latest release, the release notes, and SPARKLE_ED_KEY against the key
      # the app ships with. The notarization secrets are only used after the
      # build, so their presence is checked here, without their values.
      - name: Check the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          HAVE_NOTARY: ${{ secrets.NOTARY_API_KEY != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER != '' }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ "$HAVE_NOTARY" != true ]; then
            echo "NOTARY_API_KEY, NOTARY_KEY_ID and NOTARY_ISSUER must all be set in the environment release."
            exit 1
          fi
          scripts/launcher/scripts/appcast.sh --preflight "$VERSION"

      # An empty ref would make the checkout below take the default branch.
      - name: Read the Wine source ref
        id: ref
        run: |
          ref=$(tr -d '[:space:]' < scripts/pins/wine-src.ref)
          if [ -z "$ref" ]; then
            echo "pins/wine-src.ref names no ref."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The whole history without file contents, which come with the
      # checkout: the build writes `git describe` into ntdll, and the notes
      # name it.
      - name: Checkout Wine source
        uses: actions/checkout@v7
        with:
          repository: athei/wine
          ref: ${{ steps.ref.outputs.ref }}
          path: src
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # athei/wine carries no Wine release tags, so git describe would find
      # none. The tag of the release the source is based on comes from the
      # GitHub mirror of Wine.
      - name: Fetch the Wine release tag
        run: |
          version=$(sed -n 's/^Wine version //p' src/VERSION)
          git -C src fetch --quiet --no-tags https://github.com/wine-mirror/wine \
            "refs/tags/wine-$version:refs/tags/wine-$version"
          git -C src describe HEAD

      # The Xcode host.sh chose on an earlier run on the same runner image,
      # so it need not ask every Xcode for its SDK again (host.sh, header).
      # The key changes with the image and with host.sh and profile.sh,
      # which decide the choice; a runner that names no image version gets a
      # key no other run has. Only a run on main saves it, as every cache
      # below.
      - name: Compute the Xcode choice key
        id: xcode-key
        run: echo "key=xcode-choice-$RUNNER_OS-$ImageOS-${ImageVersion:-run$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}-${{ hashFiles('scripts/bin/ci/host.sh', 'scripts/bin/lib/profile.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Xcode choice
        id: xcode-choice
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      - name: Report the runner, select Xcode and its Metal toolchain
        run: scripts/bin/ci/host.sh --metal --xcode-choice "$RUNNER_TEMP/xcode-choice"

      - name: Save the Xcode choice
        if: github.ref == 'refs/heads/main' && steps.xcode-choice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      # The formulae at the newest versions Homebrew has, from and into the
      # cache brew-cache.yml keeps current on main. Only a run on main saves
      # the kegs (the action).
      - name: Install the Homebrew formulae
        id: brew
        uses: ./scripts/.github/actions/brew

      # Each key changes with the pins of what its cache holds, not with the
      # rest of redist.env. The ccache key rolls:
      # every run restores the newest one of the prefix, and a run on the
      # default branch saves its own.
      # The compilers go through the ccache of the Homebrew formulae
      # (WINE_BUILD_CCACHE in profile.sh), with its directory and size limit
      # here. The prefixes name the families the prune job deletes from,
      # here since ImageOS is this runner's.
      - name: Compute the cache keys
        id: keys
        run: |
          SCRIPT_DIR=scripts/bin . scripts/bin/lib/profile.sh
          . scripts/pins/redist.env
          xcode=$(xcodebuild -version | awk 'NR == 1 { print $2 }')
          llvm15=$(scripts/bin/ci/pins-key.sh LLVM15_)
          redist=$(scripts/bin/ci/pins-key.sh MTLD3D_ UNO_FLUENT_ICONS_ LLVM_MINGW_)
          sparkle=$(scripts/bin/ci/pins-key.sh SPARKLE_)
          {
            echo "llvm15=dxmt-llvm15-$LLVM15_GIT_COMMIT-floor$MACOS_FLOOR-xcode$xcode-$ImageOS-$llvm15"
            echo "redist-prefix=redist-"
            echo "redist=redist-$redist"
            echo "sparkle=sparkle-$sparkle-${{ hashFiles('scripts/launcher/scripts/fetch-sparkle.sh') }}"
            echo "cargo-prefix=cargo-"
            echo "ccache-prefix=ccache-$ImageOS-"
            echo "ccache=ccache-$ImageOS-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
          {
            echo "WINE_BUILD_CCACHE=$DEPS_PREFIX/bin/ccache"
            echo "CCACHE_DIR=$RUNNER_TEMP/ccache"
            echo "CCACHE_MAXSIZE=3G"
          } >> "$GITHUB_ENV"

      # The downloads redist.env pins: llvm-mingw here, mtld3d and the icon font
      # in the bundle step. Each is checked against its SHA-256 whether it was
      # cached or not.
      # Saved at the end of the job, after the bundle step.
      - name: Restore the pinned downloads
        id: redist
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: ${{ steps.keys.outputs.redist }}

      - name: Install llvm-mingw
        run: |
          scripts/bin/ci/llvm-mingw.sh "$HOME/llvm-mingw"
          echo "MINGW_DIR=$HOME/llvm-mingw" >> "$GITHUB_ENV"

      - name: Add the Rust target
        run: rustup target add aarch64-apple-darwin

      # What cargo fetches for the tests and lints below and for compatdb.so,
      # which the bundle step builds. Saved at the end of the job, as the
      # pinned downloads.
      - name: Restore the cargo registry
        id: cargo
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.keys.outputs.cargo-prefix }}${{ hashFiles('scripts/Cargo.lock') }}

      # The tests and lints of every crate of the workspace. compatdb.so runs
      # from a Mach-O initializer inside Wine's ntdll and the launcher crates
      # are macOS only, so their tests run here and not in compatdb.yml; the
      # launcher builds without Sparkle, since SPARKLE_DIR is unset. From
      # the repository root, as bundle-wine.sh builds compatdb.so, so cargo
      # reads .cargo/config.toml. Before the build, so a failure costs
      # minutes, not the whole build.
      - name: Test and lint the crates
        working-directory: scripts
        run: |
          rustup component add clippy
          cargo test --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings

      # One cache per staged dist (docs/internals.md, commands): Mesa with the
      # Vulkan loader, GStreamer, FEX, DXMT and vkd3d-proton. Its key is the
      # hash of the KEY line the dist's build script would write into it now
      # (--print-key): the commit its ref names (GStreamer's pin), the hash
      # of the script and profile.sh, and the versions of the compilers, SDK
      # and tools the script records. The script builds nothing when the
      # dist restored under that key is complete with that KEY, and builds
      # it otherwise; the bundle step checks every COMMIT against its ref
      # again. Restored before the build step and saved right after it, even
      # when that fails later, when the dist was built here and the run is
      # on main: under the hash of the KEY the build wrote, so
      # a ref that moved in between cannot file a dist under another
      # commit's key.
      - name: Compute the dist cache keys
        id: dists
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            key=$(scripts/bin/build-$c.sh --print-key)
            echo "$c: $key"
            echo "${c%%-*}=dist-$c-$ImageOS-$(printf '%s\n' "$key" | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Restore Mesa's dist
        id: mesa-dist
        uses: actions/cache/restore@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.dists.outputs.mesa }}

      - name: Restore GStreamer's dist
        id: gstreamer-dist
        uses: actions/cache/restore@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.dists.outputs.gstreamer }}

      - name: Restore FEX's dist
        id: fex-dist
        uses: actions/cache/restore@v6
        with:
          path: build/fex/dist
          key: ${{ steps.dists.outputs.fex }}

      - name: Restore DXMT's dist
        id: dxmt-dist
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.dists.outputs.dxmt }}

      - name: Restore vkd3d-proton's dist
        id: vkd3d-dist
        uses: actions/cache/restore@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.dists.outputs.vkd3d }}

      # The LLVM 15 libraries DXMT's winemetal.so links, which build-dxmt.sh
      # builds only when this directory holds no build of the pinned commit.
      # Saved right after the build step, even when that fails later, when
      # the run is on main.
      - name: Restore DXMT's LLVM
        id: llvm15-cache
        uses: actions/cache/restore@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}

      - name: Restore the ccache directory
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}
          restore-keys: ${{ steps.keys.outputs.ccache-prefix }}

      # So that the statistics after the build are this run's.
      - name: Reset the ccache statistics
        run: '"$WINE_BUILD_CCACHE" --zero-stats'

      # Without --clean: the runner starts without build trees, so it would
      # only delete the dists restored above, which the scripts check
      # against their KEY themselves.
      - name: Build
        id: build
        run: scripts/bin/build-wine.sh

      - name: Report the ccache statistics
        if: always() && steps.build.conclusion != 'skipped'
        run: '"$WINE_BUILD_CCACHE" --show-stats'

      # Only on main, as every cache: runs on tags, pull requests and other
      # branches restore the newest one main saved.
      - name: Save the ccache directory
        id: save-ccache
        if: always() && steps.build.conclusion != 'skipped' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.keys.outputs.ccache }}

      # The key each complete dist is saved under, from the KEY its build
      # wrote; none for a dist that is missing or incomplete.
      - name: Compute the dist save keys
        id: saves
        if: always() && steps.build.conclusion != 'skipped'
        run: |
          for c in mesa gstreamer fex dxmt vkd3d-proton; do
            dist=build/$c/dist
            if [ -f "$dist/COMMIT" ] && [ -f "$dist/KEY" ]; then
              echo "${c%%-*}=dist-$c-$ImageOS-$(shasum -a 256 < "$dist/KEY" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            fi
          done

      # Saved when the dist was not restored under the key it has now.
      - name: Save Mesa's dist
        if: always() && github.ref == 'refs/heads/main' && steps.saves.outputs.mesa != '' && (steps.mesa-dist.outputs.cache-hit != 'true' || steps.saves.outputs.mesa != steps.dists.outputs.mesa)
        uses: actions/cache/save@v6
        with:
          path: build/mesa/dist
          key: ${{ steps.saves.outputs.mesa }}

      - name: Save GStreamer's dist
        if: always() && github.ref == 'refs/heads/main' && steps.saves.outputs.gstreamer != '' && (steps.gstreamer-dist.outputs.cache-hit != 'true' || steps.saves.outputs.gstreamer != steps.dists.outputs.gstreamer)
        uses: actions/cache/save@v6
        with:
          path: build/gstreamer/dist
          key: ${{ steps.saves.outputs.gstreamer }}

      - name: Save FEX's dist
        if: always() && github.ref == 'refs/heads/main' && steps.saves.outputs.fex != '' && (steps.fex-dist.outputs.cache-hit != 'true' || steps.saves.outputs.fex != steps.dists.outputs.fex)
        uses: actions/cache/save@v6
        with:
          path: build/fex/dist
          key: ${{ steps.saves.outputs.fex }}

      - name: Save DXMT's dist
        if: always() && github.ref == 'refs/heads/main' && steps.saves.outputs.dxmt != '' && (steps.dxmt-dist.outputs.cache-hit != 'true' || steps.saves.outputs.dxmt != steps.dists.outputs.dxmt)
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/dist
          key: ${{ steps.saves.outputs.dxmt }}

      - name: Save vkd3d-proton's dist
        if: always() && github.ref == 'refs/heads/main' && steps.saves.outputs.vkd3d != '' && (steps.vkd3d-dist.outputs.cache-hit != 'true' || steps.saves.outputs.vkd3d != steps.dists.outputs.vkd3d)
        uses: actions/cache/save@v6
        with:
          path: build/vkd3d-proton/dist
          key: ${{ steps.saves.outputs.vkd3d }}

      - name: Save DXMT's LLVM
        if: always() && github.ref == 'refs/heads/main' && steps.llvm15-cache.outputs.cache-hit != 'true' && hashFiles('build/dxmt/llvm15/COMMIT') != ''
        uses: actions/cache/save@v6
        with:
          path: build/dxmt/llvm15
          key: ${{ steps.keys.outputs.llvm15 }}

      # The secrets reach this step only. The keychain it sets up signs the
      # loader in the bundle step and the app further down.
      - name: Import the signing identity
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: scripts/bin/ci/keychain.sh setup

      # Also writes the runtime-only bundle the app ships to runtime/wine in
      # RUNNER_TEMP, copied from the full one after its smoke test.
      - name: Bundle
        run: scripts/bin/bundle-wine.sh --strict-floor --symbols --yes --runtime-dest "$RUNNER_TEMP/runtime"

      # Only a release packs the trees, naming the tarballs after its tag.
      # Any other run passes --notes-only: package.sh runs every check it
      # makes before packing, writes the notes, and packs only a small part
      # of each tree with the same code, which it lists and deletes. A change
      # that breaks any of that fails on main or in its pull request before a
      # tag needs it, without spending the time to pack tarballs that would
      # be kept nowhere. A run on a pull request passes its number and
      # GITHUB_SHA, the commit that merges it into main, which the checkout
      # holds and the notes name.
      - name: Package
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            scripts/bin/ci/package.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
          elif [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            scripts/bin/ci/package.sh --notes-only "pr$PR_NUMBER-${GITHUB_SHA:0:11}" "$RUNNER_TEMP/release"
          else
            scripts/bin/ci/package.sh --notes-only "main-${GITHUB_SHA:0:11}" "$RUNNER_TEMP/release"
          fi

      # The pinned Sparkle release the launcher links and the app ships, and
      # the tools that build the appcast (fetch-sparkle.sh), in the place
      # launcher/Makefile looks for them. The key changes with the SPARKLE_
      # pins of redist.env and with fetch-sparkle.sh. Saved below once the
      # app is assembled.
      - name: Restore Sparkle
        id: sparkle
        uses: actions/cache/restore@v6
        with:
          path: scripts/target/launcher/sparkle
          key: ${{ steps.keys.outputs.sparkle }}

      # Mach9.app around the runtime-only bundle, in target/launcher/stage of
      # the checkout, unsigned (launcher/Makefile). A run on a tag stamps the
      # tag's version into it, any other run the workspace version.
      - name: Assemble Mach9.app
        id: app
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if [ -n "$TAG_VERSION" ]; then
            version=$TAG_VERSION
            make -C scripts/launcher app WINE_RUNTIME="$RUNNER_TEMP/runtime/wine" VERSION="$version"
          else
            version=$(scripts/launcher/scripts/version.sh)
            make -C scripts/launcher app WINE_RUNTIME="$RUNNER_TEMP/runtime/wine"
          fi
          name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' scripts/launcher/app/Info.plist)
          app="$GITHUB_WORKSPACE/scripts/target/launcher/stage/$name.app"
          if [ ! -d "$app" ]; then
            echo "make app left no $app"
            exit 1
          fi
          {
            echo "version=$version"
            echo "name=$name"
            echo "path=$app"
          } >> "$GITHUB_OUTPUT"

      # The pinned downloads, the cargo registry and Sparkle, which the
      # bundle step and the app's assembly complete, saved when they were not
      # restored under their key, by a run on main only. As actions/cache
      # does in its post step, only when every step before succeeded.
      - name: Save the pinned downloads
        id: save-redist
        if: github.ref == 'refs/heads/main' && steps.redist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache
          key: ${{ steps.keys.outputs.redist }}

      - name: Save the cargo registry
        id: save-cargo
        if: github.ref == 'refs/heads/main' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo.outputs.cache-primary-key }}

      - name: Save Sparkle
        if: github.ref == 'refs/heads/main' && steps.sparkle.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: scripts/target/launcher/sparkle
          key: ${{ steps.keys.outputs.sparkle }}

      # What a release does with the app short of notarizing it: sign it with
      # the Developer ID identity of the keychain above, then pack its DMG on
      # the runner, Finder styling included. A change that breaks either
      # fails on main or in its pull request before a tag needs it.
      - name: Sign Mach9.app
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          APP: ${{ steps.app.outputs.path }}
        run: scripts/launcher/scripts/codesign-bundle.sh sign "$APP"

      - name: Pack the DMG
        if: "!startsWith(github.ref, 'refs/tags/')"
        env:
          APP: ${{ steps.app.outputs.path }}
          NAME: ${{ steps.app.outputs.name }}
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          scripts/launcher/scripts/make-dmg.sh --out "$RUNNER_TEMP/app/$NAME.dmg" "$APP"

      # appcast.sh downloads the DMG of every release the appcast keeps, and
      # generate_appcast unpacks each to make the deltas. Nothing reads the
      # Wine source, the build trees, the staged dists, the bundles, whose
      # tarballs are packed, the runtime-only copy, which the app holds, the
      # ccache directory or the test build of the crates any more.
      - name: Free disk space
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          df -h "$GITHUB_WORKSPACE"
          rm -rf src build dist scripts/target/debug "$RUNNER_TEMP/runtime" "$CCACHE_DIR"
          df -h "$GITHUB_WORKSPACE"

      # notarytool reads the App Store Connect API key from a file. Only this
      # step and the next get the notarization secrets; the file is deleted
      # at the end of the job.
      - name: Write the notarization key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: |
          umask 077
          printf '%s' "$NOTARY_API_KEY" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          if [ ! -s "$RUNNER_TEMP/notary-key.p8" ]; then
            echo "NOTARY_API_KEY is not set in the environment release."
            exit 1
          fi

      # Signs, notarizes and staples the app, packs its DMG, and builds the
      # appcast and the deltas into this release on the appcast of the latest
      # one (make-release.sh, appcast.sh). The DMG has the app's name alone,
      # which the download link asks releases/latest/download for and every
      # appcast item points at in its own release.
      - name: Release Mach9.app
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP: ${{ steps.app.outputs.path }}
          VERSION: ${{ steps.app.outputs.version }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/launcher/scripts/make-release.sh --version "$VERSION" --out "$RUNNER_TEMP/app-release" "$APP"

      # The body is the release notes the app shows, the file of X.Y.Z for a
      # release candidate of it too, then the sources the bundle was built
      # from (package.sh). Both are one paragraph per line, which GitHub
      # renders as they are.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.app.outputs.name }}
          BASE: ${{ steps.tag.outputs.base }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          app=$RUNNER_TEMP/app-release
          body=$RUNNER_TEMP/release-body.md
          {
            cat "scripts/release-notes/$BASE.md"
            printf '\n\n## Components\n\n'
            cat "$RUNNER_TEMP/release/notes.md"
          } > "$body"
          flags=(--draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$body")
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          shopt -s nullglob
          deltas=("$app"/*.delta)
          echo "Deltas: ${#deltas[@]}"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "$RUNNER_TEMP/release/wine-$GITHUB_REF_NAME-macos-arm64.tar.xz" \
            "$RUNNER_TEMP/release/wine-$GITHUB_REF_NAME-macos-arm64-symbols.tar.xz" \
            "$app/$NAME.dmg" \
            "${deltas[@]}" \
            "$app/appcast.xml"

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/notary-key.p8"

      - name: Remove the signing identity
        if: always()
        run: |
          if [ -x scripts/bin/ci/keychain.sh ]; then
            scripts/bin/ci/keychain.sh cleanup
          fi

  # Deletes the caches of main that the build's saves replaced, for the
  # families that weigh on the cache budget (bin/ci/prune-caches.sh, header):
  # the ccache directories, the Homebrew kegs, the pinned downloads and the
  # cargo registries. A family is pruned only when its save succeeded, also
  # after a build that failed later. The other caches are small and left to
  # GitHub's eviction. The only job that may write actions, and it runs no
  # code but this repository's script.
  prune:
    needs: build
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout the script
        uses: actions/checkout@v7
        with:
          path: scripts
          sparse-checkout: bin/ci
          persist-credentials: false

      - name: Prune the caches the build replaced
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BREW_PREFIX: ${{ needs.build.outputs.brew-prefix }}
          BREW: ${{ needs.build.outputs.brew-key }}
          CCACHE_PREFIX: ${{ needs.build.outputs.ccache-prefix }}
          CCACHE: ${{ needs.build.outputs.ccache-key }}
          REDIST_PREFIX: ${{ needs.build.outputs.redist-prefix }}
          REDIST: ${{ needs.build.outputs.redist-key }}
          CARGO_PREFIX: ${{ needs.build.outputs.cargo-prefix }}
          CARGO: ${{ needs.build.outputs.cargo-key }}
        run: |
          scripts/bin/ci/prune-caches.sh \
            "$BREW_PREFIX" "$BREW" \
            "$CCACHE_PREFIX" "$CCACHE" \
            "$REDIST_PREFIX" "$REDIST" \
            "$CARGO_PREFIX" "$CARGO"
