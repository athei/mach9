name: Homebrew cache

# Keeps the cache of the Homebrew kegs release.yml installs current. A run
# on main writes caches that runs on every tag can read, so a release build
# finds the kegs of its own manifest, or of one a day old, and downloads
# little. A manual run on another branch saves nothing, as in release.yml.
# The steps are the local action .github/actions/brew, which release.yml
# runs too, and the logic is in bin/ci/brew.sh.

# A change to the scripts the key hashes changes its prefix, so a push of one
# to main makes main's cache for them right away.
on:
  schedule:
    - cron: '23 4 * * *'
  push:
    branches: [main]
    paths:
      - pins/brew-formulae
      - bin/ci/brew.sh
      - .github/actions/brew/**
  workflow_dispatch:

concurrency:
  group: brew-cache

defaults:
  run:
    shell: bash

jobs:
  brew:
    runs-on: macos-26
    timeout-minutes: 60
    # Not actions: this job runs Homebrew's code, so the prune job below
    # deletes caches.
    permissions:
      contents: read
    outputs:
      brew-prefix: ${{ steps.brew.outputs.prefix }}
      brew-key: ${{ steps.brew.outputs.saved-key }}
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7
        with:
          path: scripts
          persist-credentials: false

      # The Xcode choice, cached as in release.yml, under the same key.
      - name: Compute the Xcode choice key
        id: xcode-key
        run: echo "key=xcode-choice-$RUNNER_OS-$ImageOS-${ImageVersion:-run$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT}-${{ hashFiles('scripts/bin/ci/host.sh', 'scripts/bin/lib/profile.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore the Xcode choice
        id: xcode-choice
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      # The Xcode release.yml selects before it installs the formulae.
      - name: Report the runner and select Xcode
        run: scripts/bin/ci/host.sh --xcode-choice "$RUNNER_TEMP/xcode-choice"

      - name: Save the Xcode choice
        if: github.ref == 'refs/heads/main' && steps.xcode-choice.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/xcode-choice
          key: ${{ steps.xcode-key.outputs.key }}

      - name: Install the Homebrew formulae
        id: brew
        uses: ./scripts/.github/actions/brew

  # Deletes the kegs of main this run's save replaced, as the prune job of
  # release.yml does (bin/ci/prune-caches.sh).
  prune:
    needs: brew
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout the script
        uses: actions/checkout@v7
        with:
          path: scripts
          sparse-checkout: bin/ci
          persist-credentials: false

      - name: Prune the kegs the save replaced
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BREW_PREFIX: ${{ needs.brew.outputs.brew-prefix }}
          BREW: ${{ needs.brew.outputs.brew-key }}
        run: scripts/bin/ci/prune-caches.sh "$BREW_PREFIX" "$BREW"
