# The groups of the deqp-vk suite of the conformance runner: the Vulkan CTS
# cases it runs on KosmicKrisp (docs/internals.md, deqp-vk suite). A group
# is opt-in: it is here because a change to our Mesa needs its cases, and it
# grows when an issue needs more. The full mustpass is not a goal.
#
# [[group]]
# name     = "draw"         letters, digits, `_` and `-`; its expected
#                           results are baselines/deqp-vk/<name>.txt
# issues   = [61]           the mach9 issues whose changes the group checks
# cases    = ["dEQP-VK.draw.*"]
#                           patterns over the case names of the vk-default
#                           mustpass of the pinned VK-GL-CTS; `*` matches any
#                           run of characters, dots included
# exclude  = ["*.rgen"]     optional: patterns of matching cases left out;
#                           only for a feature KosmicKrisp does not have at
#                           all, each with its reason in a comment, never a
#                           case that runs
# fraction = 4             optional: every 4th matching case, in mustpass
#                           order, as deqp-runner's --fraction takes them;
#                           1, all of them, by default
# kk_debug = "force_icb"    optional: MESA_KK_DEBUG of the group's deqp-vk
#                           processes, a comma-separated list of
#                           KosmicKrisp's debug names; unset by default. A
#                           KosmicKrisp without a name ignores it
#
# A case may match several groups; it runs once for each kk_debug setting of
# those groups, and the groups of one setting run in processes of their own.

[[group]]
name = "draw"
issues = [61]
cases = [
    "dEQP-VK.draw.*",
    "dEQP-VK.conditional_rendering.*",
    "dEQP-VK.multiview.*",
    "dEQP-VK.robustness.index_access.*indirect*",
    "dEQP-VK.robustness.bind_index_buffer2.*indirect*",
]

# The cases of draw with every indirect-count draw run from an indirect
# command buffer whatever its maxDrawCount (#61): the cases' counts are below
# the threshold, so draw alone never reaches that path. Its expected results
# equal draw's.
[[group]]
name = "draw-icb"
issues = [61]
kk_debug = "force_icb"
cases = [
    "dEQP-VK.draw.*",
    "dEQP-VK.conditional_rendering.*",
    "dEQP-VK.multiview.*",
    "dEQP-VK.robustness.index_access.*indirect*",
    "dEQP-VK.robustness.bind_index_buffer2.*indirect*",
]

[[group]]
name = "robust-buffer-access"
issues = [62]
cases = [
    "dEQP-VK.robustness.*buffer_access.*",
    "dEQP-VK.robustness.robustness2.*.storage_buffer*",
    "dEQP-VK.robustness.robustness2.*.uniform_buffer*",
    "dEQP-VK.robustness.pipeline_robustness.robustness2.*.storage_buffer*",
    "dEQP-VK.robustness.pipeline_robustness.robustness2.*.uniform_buffer*",
    "dEQP-VK.ssbo.*",
]
exclude = [
    # Ray generation shaders: KosmicKrisp has no ray tracing, so each of
    # these cases ends NotSupported.
    "dEQP-VK.robustness.robustness2.*.rgen",
    "dEQP-VK.robustness.robustness2.*.rgen_compute",
]

# Storage buffer cases with every storage and uniform buffer access under
# robust buffer access (#62). The ssbo cases of robust-buffer-access create
# their devices without it, so only force_robustness sends their row-major
# columns, bool, 8-bit and 16-bit vectors through the bounded loads. The
# opatomic cases check the values of atomic loads from storage buffers; the
# atomicwrite message passing cases read their guard with an atomic load
# too, but check only that a nonzero guard comes with the payload.
[[group]]
name = "robust-buffer-access-forced"
issues = [62]
kk_debug = "force_robustness"
cases = [
    "dEQP-VK.ssbo.*",
    "dEQP-VK.spirv_assembly.instruction.compute.8bit_storage.*",
    "dEQP-VK.spirv_assembly.instruction.compute.16bit_storage.*",
    "dEQP-VK.spirv_assembly.instruction.compute.opatomic*",
    "dEQP-VK.memory_model.message_passing.*.atomic_atomic.*.guard_local.buffer.comp",
]

# The synchronization and memory model cases of #63 in three groups, so that
# a record of one of them stays short enough to share the machine.
[[group]]
name = "synchronization"
issues = [63]
cases = [
    "dEQP-VK.synchronization.*",
    "dEQP-VK.query_pool.*occlusion*",
]

[[group]]
name = "synchronization2"
issues = [63]
cases = ["dEQP-VK.synchronization2.*"]

[[group]]
name = "memory-model"
issues = [63]
cases = ["dEQP-VK.memory_model.*"]
exclude = [
    # 64-bit atomic read-modify-write in a fragment shader hangs the GPU in
    # some runs and not in others (#91): VK_ERROR_DEVICE_LOST, which can
    # take other processes' devices with it. Remove with #91.
    "dEQP-VK.memory_model.write_after_read.ext.u64.*.atomic_atomic.atomicrmw.*.payload_local.*.frag",
    "dEQP-VK.memory_model.message_passing.ext.u64.*.atomic_atomic.atomicrmw.*.payload_local.*.frag",
]

# Query results and availability the host or vkCmdCopyQueryPoolResults
# reads, for the query types KosmicKrisp has besides occlusion (in
# synchronization and occlusion) and timestamps (in timestamp): pipeline
# statistics and transform feedback streams. #63 lowers the visibility of
# the barriers that make these writes visible.
[[group]]
name = "query"
issues = [63]
cases = [
    "dEQP-VK.query_pool.statistics_query.*",
    "dEQP-VK.query_pool.frag_invocations.*",
    "dEQP-VK.query_pool.discard.*",
    "dEQP-VK.query_pool.concurrent_queries.*",
    "dEQP-VK.query_pool.maintenance7.*",
    "dEQP-VK.transform_feedback.simple.*query*",
]

# Resources that share memory: aliased sparse bindings, buffers and images
# bound to the same memory, and multi-planar images aliased with
# VK_IMAGE_CREATE_ALIAS_BIT. #63 lowers the barriers' visibility from
# ResourceAlias, the Metal option that makes aliased virtual addresses
# memory consistent, to Device. Only the sparse cases write through one
# alias and read through the other in one command buffer, with a barrier
# between; the memory.binding and ycbcr plane_view cases submit and wait
# between the write and the read, so they check the binding, not the
# barrier.
[[group]]
name = "aliasing"
issues = [63]
cases = [
    "dEQP-VK.sparse_resources.image_sparse_memory_aliasing.*",
    "dEQP-VK.sparse_resources.buffer.*aliased*",
    "dEQP-VK.memory.binding.*aliasing.*",
    "dEQP-VK.ycbcr.plane_view.memory_alias.*",
]

# Occlusion queries, which count into a visibility result buffer that the
# render encoders of a pass accumulate into (#120). The query_pool cases
# are in synchronization too.
[[group]]
name = "occlusion"
issues = [120]
cases = [
    "dEQP-VK.query_pool.*occlusion*",
    "dEQP-VK.fragment_operations.occlusion_query.*",
    "dEQP-VK.api.command_buffers.inherited_occlusion_query*",
]

# Timestamp queries. The multiview cases, which are in draw too, write
# timestamps inside render passes.
[[group]]
name = "timestamp"
issues = [106]
cases = [
    "dEQP-VK.pipeline.monolithic.timestamp.*",
    "dEQP-VK.multiview.*timestamp*",
]

# Fragment shaders that run per sample, whose fragment coordinate
# KosmicKrisp moves to the sample (#124): the cases guard x and y, a
# constant z and depth writes under sample shading. None checks a sloped z;
# smoke/egl.c depth-bias does.
[[group]]
name = "sample-shading"
issues = [124]
cases = [
    "dEQP-VK.glsl.builtin_var.fragcoord_msaa*",
    "dEQP-VK.glsl.builtin_var.fragdepth.*",
    "dEQP-VK.glsl.builtin_var.simple.fragcoord_xyz",
    "dEQP-VK.pipeline.monolithic.multisample_shader_builtin.*",
    "dEQP-VK.pipeline.monolithic.multisample.min_sample_shading*",
    "dEQP-VK.pipeline.monolithic.multisample.z_export.*",
    "dEQP-VK.pipeline.monolithic.multisample.sample_mask_with_depth_test.*",
]
